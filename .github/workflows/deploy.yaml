name: Deploy

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for keyless Cosign signing via GitHub Actions OIDC

on:
  push:
    branches:
      - development
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "nest-cli.json"
      - "Dockerfile"
      - ".dockerignore"

  release:
    types: [published]

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: ${{ secrets.DO_REGISTRY_NAME }}/norse-api

jobs:
  build-and-push:
    name: Build, sign and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag is semver
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] \
            || { echo "::error::Release tag '${GITHUB_REF_NAME}' is not v-prefixed semver (expected vMAJOR.MINOR.PATCH)"; exit 1; }

      - name: Checkout code
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to DigitalOcean Container Registry
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Extract candidate tag and labels for Docker
        id: meta
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=candidate-${{ github.sha }}-${{ github.run_number }}

      - name: Build and push candidate image
        id: build
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        # sigstore/cosign-installer v4.1.2 (installs cosign 3.0.6)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image digest (keyless, GitHub Actions OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify image digest signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/211-Connect/Norse-API/.github/workflows/deploy.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Publish release tag on verified digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify release tag resolves to the signed digest
        if: github.ref_type == 'tag'
        run: |
          cosign verify \
            --certificate-identity "https://github.com/211-Connect/Norse-API/.github/workflows/deploy.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"

      - name: Publish dev tag on verified digest
        if: github.ref_type == 'branch' && github.ref_name == 'development'
        id: devtag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          DEV_TAG="dev-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "Publishing ${REGISTRY}/${IMAGE_NAME}:${DEV_TAG}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${DEV_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          echo "dev_tag=${DEV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify dev tag resolves to the signed digest
        if: github.ref_type == 'branch' && github.ref_name == 'development'
        env:
          DEV_TAG: ${{ steps.devtag.outputs.dev_tag }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/211-Connect/Norse-API/.github/workflows/deploy.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}:${DEV_TAG}"
